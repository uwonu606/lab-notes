<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="브랜치에서 커밋 7개를 아낌없이 만들고, PR 전에 rebase 로 4개로 다시 짜고, PR 을 연 뒤 squash merge 해서 main 에는 커밋 1개만 남는 흐름" font-family="'IBM Plex Sans KR', 'Noto Sans KR', system-ui, sans-serif" font-size="12">
  <style>
    svg { color: #767676; fill: currentColor; }
    @media (prefers-color-scheme: dark) { svg { color: #e0e0e0; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- main -->
  <line x1="40" y1="270" x2="860" y2="270" stroke="currentColor" stroke-width="2"/>
  <text x="40" y="296" font-family="'IBM Plex Mono', monospace" font-size="11" opacity="0.7">main</text>
  <circle cx="90" cy="270" r="7" fill="currentColor"/>
  <circle cx="830" cy="270" r="7" fill="none" stroke="currentColor" stroke-dasharray="2 2"/>

  <!-- branch off main -->
  <path d="M 90 270 C 90 150, 100 100, 140 100" fill="none" stroke="currentColor" stroke-width="1.5"/>

  <!-- ① commit liberally -->
  <text x="245" y="62" text-anchor="middle" font-weight="600">① 브랜치에서 아낌없이 커밋한다</text>
  <line x1="140" y1="100" x2="350" y2="100" stroke="currentColor" stroke-width="1.5"/>
  <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 2">
    <circle cx="140" cy="100" r="6"/><circle cx="175" cy="100" r="6"/><circle cx="210" cy="100" r="6"/>
    <circle cx="245" cy="100" r="6"/><circle cx="280" cy="100" r="6"/><circle cx="315" cy="100" r="6"/><circle cx="350" cy="100" r="6"/>
  </g>
  <g font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle" opacity="0.7">
    <text x="140" y="122">wip</text><text x="175" y="122">wip</text><text x="210" y="122">fix</text>
    <text x="245" y="122">wip</text><text x="280" y="122">docs</text><text x="315" y="122">oops</text><text x="350" y="122">fix</text>
  </g>

  <!-- ② rebase -->
  <path d="M 365 100 L 425 178" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="352" y="150" text-anchor="end" font-weight="600">② rebase</text>
  <text x="352" y="166" text-anchor="end" font-size="11" opacity="0.7">작고 순서 있게 다시 짠다</text>

  <!-- row B: small ordered commits -->
  <text x="530" y="150" text-anchor="middle" font-size="11" opacity="0.7">커밋 하나하나가 나중에 PR 하나가 될 수 있는 크기</text>
  <line x1="440" y1="180" x2="620" y2="180" stroke="currentColor" stroke-width="1.5"/>
  <g fill="currentColor">
    <circle cx="440" cy="180" r="8"/><circle cx="500" cy="180" r="8"/><circle cx="560" cy="180" r="8"/><circle cx="620" cy="180" r="8"/>
  </g>
  <g font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">
    <text x="440" y="206">feat</text><text x="500" y="206">docs</text><text x="560" y="206">refactor</text><text x="620" y="206">fix</text>
  </g>

  <!-- ③ PR -->
  <path d="M 632 180 L 668 180" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="670" y="158" width="120" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="730" y="176" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600">③ PR #366</text>
  <text x="730" y="192" text-anchor="middle" font-size="10" opacity="0.7">ready, draft 아님</text>

  <!-- ④ squash -->
  <path d="M 730 204 L 730 258" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="742" y="234" font-weight="600">④ squash merge</text>
  <circle cx="730" cy="270" r="9" style="fill:var(--accent,#0E8F75)"/>
  <text x="730" y="298" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10">5bf2b15 feat(pstack): … (#366)</text>
  <text x="730" y="314" text-anchor="middle" font-size="10" opacity="0.7">main 에는 1개. 본문 안에 4개의 메시지</text>
</svg>
