<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-label="플레이북 넷이 정한 커밋 순서. bug-fix 는 재현 뒤 고침, refactoring 은 빼기·모양 바꾸기·정리, hillclimb 은 받아들인 고침마다 커밋 하나, pause-safely 는 wip 커밋 하나" font-family="'IBM Plex Sans KR', 'Noto Sans KR', system-ui, sans-serif" font-size="12">
  <style>
    svg { color: #767676; fill: currentColor; }
    @media (prefers-color-scheme: dark) { svg { color: #e0e0e0; } }
  </style>
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" text-anchor="end">
    <text x="150" y="49">bug-fix</text>
    <text x="150" y="114">refactoring</text>
    <text x="150" y="179">hillclimb</text>
    <text x="150" y="244">pause-safely</text>
  </g>
  <line x1="170" y1="20" x2="170" y2="270" stroke="currentColor" stroke-width="1" opacity="0.3"/>

  <!-- bug-fix -->
  <path d="M 208 45 L 292 45" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <circle cx="200" cy="45" r="8" fill="currentColor"/>
  <circle cx="300" cy="45" r="8" fill="currentColor"/>
  <text x="200" y="70" text-anchor="middle" font-size="10">실패하는 재현</text>
  <text x="300" y="70" text-anchor="middle" font-size="10">고침</text>
  <text x="360" y="49" font-size="11" opacity="0.7">재현이 고침보다 먼저 git 기록에 들어간다</text>

  <!-- refactoring -->
  <path d="M 208 110 L 292 110" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <path d="M 308 110 L 392 110" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <g fill="currentColor"><circle cx="200" cy="110" r="8"/><circle cx="300" cy="110" r="8"/><circle cx="400" cy="110" r="8"/></g>
  <g font-size="11" font-weight="600" text-anchor="middle" style="fill:var(--accent,#0E8F75)">
    <text x="200" y="94">✓</text><text x="300" y="94">✓</text><text x="400" y="94">✓</text>
  </g>
  <text x="200" y="135" text-anchor="middle" font-size="10">빼기</text>
  <text x="300" y="135" text-anchor="middle" font-size="10">모양 바꾸기</text>
  <text x="400" y="135" text-anchor="middle" font-size="10">뒤따르는 정리</text>
  <text x="460" y="114" font-size="11" opacity="0.7">조각마다 다음으로 가기 전에 테스트를 통과(✓)한 채로</text>

  <!-- hillclimb -->
  <path d="M 208 175 L 292 175" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <path d="M 308 175 L 392 175" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <g fill="currentColor"><circle cx="200" cy="175" r="8"/><circle cx="300" cy="175" r="8"/><circle cx="400" cy="175" r="8"/></g>
  <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6">
    <circle cx="250" cy="200" r="6"/><circle cx="350" cy="200" r="6"/>
  </g>
  <g font-size="10" text-anchor="middle" opacity="0.6"><text x="250" y="204">×</text><text x="350" y="204">×</text></g>
  <text x="300" y="222" text-anchor="middle" font-size="10" opacity="0.7">× 는 재 보고 되돌린 가설. 기록에는 남기고 커밋은 안 한다</text>
  <text x="460" y="179" font-size="11" opacity="0.7">받아들인 고침 하나에 커밋 하나. 바꾼 파일만 git add</text>

  <!-- pause-safely -->
  <rect x="190" y="226" width="80" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="230" y="245" text-anchor="middle" font-size="10">편집 중인 트리</text>
  <path d="M 275 241 L 322 241" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <circle cx="335" cy="241" r="8" fill="currentColor"/>
  <text x="335" y="266" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10">wip: …</text>
  <text x="400" y="245" font-size="11" opacity="0.7">멈출 땐 wip: 커밋 하나로 남긴다. 트리가 깨졌으면 본문 한 줄로 말한다</text>
</svg>
