  <text x="40" y="280" font-size="14" opacity="0.7">새 4개. 전부 새 해시</text>
  <path d="M 110 192 C 130 260, 150 270, 175 270" fill="none" stroke-width="2.5" style="stroke:var(--accent,#0E8F75)"/>
  <line x1="200" y1="270" x2="660" y2="270" stroke-width="2.5" style="stroke:var(--accent,#0E8F75)"/>
  <g fill="none" stroke-width="3" style="stroke:var(--accent,#0E8F75)">
    <circle cx="200" cy="270" r="20"/><circle cx="360" cy="270" r="20"/><circle cx="520" cy="270" r="20"/><circle cx="680" cy="270" r="20"/>
  </g>
  <g font-family="'IBM Plex Mono', monospace" font-size="13" text-anchor="middle">
    <text x="200" y="306">feat</text><text x="360" y="306">docs</text><text x="520" y="306">refactor</text><text x="680" y="306">fix</text>
  </g>
  <path d="M 720 236 L 800 236 L 812 248 L 800 260 L 720 260 Z" fill="none" stroke-width="2.5" style="stroke:var(--accent,#0E8F75)"/>
  <text x="760" y="253" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="600" style="fill:var(--accent,#0E8F75)">feature</text>
  <path d="M 718 252 L 706 262" fill="none" stroke-width="2.5" marker-end="url(#ga4)" style="stroke:var(--accent,#0E8F75)"/>

  <!-- reflog -->
  <rect x="700" y="60" width="180" height="70" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.7"/>
  <text x="712" y="84" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="600" opacity="0.8">reflog</text>
  <text x="712" y="106" font-size="12" opacity="0.7">feature: wip(7번째) → fix</text>
  <text x="712" y="122" font-size="12" opacity="0.7">이름표가 옮겨 간 일기</text>
