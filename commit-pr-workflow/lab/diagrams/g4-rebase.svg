<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-label="rebase 는 wip 커밋 일곱을 다시 재생해 새 커밋 넷을 만들고 이름표를 옮긴다. 옛 일곱은 남고, reflog 가 이름표의 이동을 적는다" font-family="'IBM Plex Sans KR', 'Noto Sans KR', system-ui, sans-serif" font-size="18">
  <style>
    svg { color: #767676; fill: currentColor; }
    @media (prefers-color-scheme: dark) { svg { color: #e0e0e0; } }
  </style>
  <defs><marker id="ga4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/></marker></defs>
  <circle cx="90" cy="180" r="22" fill="none" stroke="currentColor" stroke-width="3"/>
  <text x="90" y="186" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="15">m</text>

  <!-- old row -->
  <text x="40" y="70" font-size="14" opacity="0.6">옛 7개. 이름표가 떠났다</text>
  <path d="M 110 168 C 130 100, 150 90, 175 90" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4" opacity="0.45"/>
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4" opacity="0.45">
    <circle cx="190" cy="90" r="15"/><circle cx="270" cy="90" r="15"/><circle cx="350" cy="90" r="15"/><circle cx="430" cy="90" r="15"/>
    <circle cx="510" cy="90" r="15"/><circle cx="590" cy="90" r="15"/><circle cx="670" cy="90" r="15"/>
  </g>
  <line x1="205" y1="90" x2="655" y2="90" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4" opacity="0.45"/>
  <g font-family="'IBM Plex Mono', monospace" font-size="12" text-anchor="middle" opacity="0.55">
    <text x="190" y="118">wip</text><text x="270" y="118">wip</text><text x="350" y="118">fix</text><text x="430" y="118">wip</text>
    <text x="510" y="118">docs</text><text x="590" y="118">oops</text><text x="670" y="118">fix</text>
  </g>

