  <text x="420" y="322" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="600">main</text>
  <text x="300" y="215" text-anchor="middle" font-size="14" style="fill:var(--accent,#0E8F75)">main 에서 4개가 닿는다</text>

  <line x1="460" y1="20" x2="460" y2="330" stroke="currentColor" stroke-width="1" opacity="0.2"/>

  <text x="680" y="36" text-anchor="middle" font-weight="600" font-size="20">squash merge</text>
  <text x="680" y="60" text-anchor="middle" font-size="14" opacity="0.7">부모 화살표 하나</text>
  <circle cx="520" cy="280" r="18" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <text x="520" y="285" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="12">seed</text>
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4" opacity="0.5"><circle cx="600" cy="150" r="16"/><circle cx="680" cy="150" r="16"/><circle cx="760" cy="150" r="16"/><circle cx="840" cy="150" r="16"/></g>
  <path d="M 588 162 L 532 266" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4" opacity="0.5" marker-end="url(#g7a)"/>
  <path d="M 664 150 L 618 150" fill="none" stroke="currentColor" stroke-width="2" opacity="0.5" marker-end="url(#g7a)"/>
  <path d="M 744 150 L 698 150" fill="none" stroke="currentColor" stroke-width="2" opacity="0.5" marker-end="url(#g7a)"/>
