<title>squash 와 merge 의 차이</title>

<main>
<header>
  <h1>squash 와 merge 의 차이</h1>
  <p>차이는 딱 하나, 새 커밋의 부모 화살표가 둘이냐 하나냐. 나머지는 전부 거기서 따라온다.</p>
</header>
<section>
  <p class="one">부모 화살표가 둘이면 main 에서 브랜치 커밋에 닿는다. 하나면 못 닿는다.</p>

  <text x="420" y="286" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="600">M</text>

  <text x="880" y="322" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="600">main</text>
  <text x="720" y="215" text-anchor="middle" font-size="14" opacity="0.7">4개로 가는 화살표가 없다</text>
  <text x="850" y="120" text-anchor="middle" font-size="12" opacity="0.6">feature 이름표만 붙들고 있다</text>
</svg></figure>
</section>
<section>
  <p class="one">브랜치 이름표를 지우면 그 차이가 드러난다.</p>
  <figure><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="feature 이름표를 지우면 merge commit 쪽은 main 이 넷을 계속 붙들고, squash 쪽은 넷이 아무 이름표에도 안 걸린 채 남는다" font-family="'IBM Plex Sans KR', 'Noto Sans KR', system-ui, sans-serif" font-size="16">
  <defs><marker id="g8a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/></marker>
  <marker id="g8b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" style="fill:var(--accent,#0E8F75)"/></marker></defs>
  <text x="450" y="34" text-anchor="middle" font-size="18" font-weight="600">feature 이름표를 지운다</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" opacity="0.7">git branch -D feature. GitHub 은 squash 뒤 이걸 자동으로 한다</text>

  <circle cx="60" cy="250" r="16" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <g fill="none" stroke-width="2.5" style="stroke:var(--accent,#0E8F75)"><circle cx="140" cy="140" r="14"/><circle cx="210" cy="140" r="14"/><circle cx="280" cy="140" r="14"/><circle cx="350" cy="140" r="14"/></g>
  <path d="M 130 151 L 70 238" fill="none" stroke-width="2.5" marker-end="url(#g8b)" style="stroke:var(--accent,#0E8F75)"/>
  <path d="M 196 140 L 156 140" fill="none" stroke-width="2.5" marker-end="url(#g8b)" style="stroke:var(--accent,#0E8F75)"/>
  <path d="M 266 140 L 226 140" fill="none" stroke-width="2.5" marker-end="url(#g8b)" style="stroke:var(--accent,#0E8F75)"/>
  <path d="M 336 140 L 296 140" fill="none" stroke-width="2.5" marker-end="url(#g8b)" style="stroke:var(--accent,#0E8F75)"/>
  <circle cx="400" cy="250" r="20" fill="none" stroke-width="3.5" style="stroke:var(--accent,#0E8F75)"/>
  <text x="400" y="255" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="600">M</text>
  <path d="M 380 250 L 78 250" fill="none" stroke-width="2.5" marker-end="url(#g8b)" style="stroke:var(--accent,#0E8F75)"/>
  <path d="M 392 231 L 358 155" fill="none" stroke-width="3" marker-end="url(#g8b)" style="stroke:var(--accent,#0E8F75)"/>
  <text x="400" y="290" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="600">main</text>
  <text x="245" y="100" text-anchor="middle" font-size="14" style="fill:var(--accent,#0E8F75)">main 이 계속 붙들고 있다</text>

  <line x1="460" y1="70" x2="460" y2="290" stroke="currentColor" stroke-width="1" opacity="0.2"/>

  <circle cx="520" cy="250" r="16" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4" opacity="0.35"><circle cx="600" cy="140" r="14"/><circle cx="670" cy="140" r="14"/><circle cx="740" cy="140" r="14"/><circle cx="810" cy="140" r="14"/></g>
  <path d="M 590 151 L 530 238" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4" opacity="0.35" marker-end="url(#g8a)"/>
  <path d="M 656 140 L 616 140" fill="none" stroke="currentColor" stroke-width="2" opacity="0.35" marker-end="url(#g8a)"/>
  <path d="M 726 140 L 686 140" fill="none" stroke="currentColor" stroke-width="2" opacity="0.35" marker-end="url(#g8a)"/>
  <path d="M 796 140 L 756 140" fill="none" stroke="currentColor" stroke-width="2" opacity="0.35" marker-end="url(#g8a)"/>

  <text x="705" y="100" text-anchor="middle" font-size="14" opacity="0.7">아무 이름표도 안 가리킨다. 물건은 아직 있다</text>
</svg></figure>
  <p>왼쪽은 main 이 4개를 붙들고 있어서 아무 일도 없다. 오른쪽은 4개가 어떤 이름표에도 안 걸린 채 남는다. 지워진 게 아니다.</p>
</section>
<section>
  <p class="one">"복구하기 힘들다"는 이름표를 잃은 뒤 시간이 지나서의 일이다.</p>
  <figure><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" role="img" aria-label="이름표를 잃은 커밋의 시간표. reflog 가 30일 기억하고, 그 뒤 gc 가 지우면 그때 정말 사라진다. 복구하기 힘들다는 말은 그 뒤의 일이다" font-family="'IBM Plex Sans KR', 'Noto Sans KR', system-ui, sans-serif" font-size="15">
  <defs><marker id="g9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/></marker></defs>
  <line x1="60" y1="130" x2="860" y2="130" stroke="currentColor" stroke-width="3" marker-end="url(#g9a)"/>
  <g stroke="currentColor" stroke-width="3"><line x1="120" y1="115" x2="120" y2="145"/><line x1="420" y1="115" x2="420" y2="145"/><line x1="700" y1="115" x2="700" y2="145"/></g>
  <text x="120" y="95" text-anchor="middle" font-weight="600">이름표를 잃음</text>
  <text x="120" y="175" text-anchor="middle" font-size="13" opacity="0.7">branch -D, rebase, amend</text>
  <text x="420" y="95" text-anchor="middle" font-weight="600">reflog 만료</text>
  <text x="420" y="175" text-anchor="middle" font-size="13" opacity="0.7">기본 30일 (닿지 않는 것)</text>
  <text x="700" y="95" text-anchor="middle" font-weight="600">git gc 가 지움</text>
  <text x="700" y="175" text-anchor="middle" font-size="13" opacity="0.7">물건이 정말 없어진다</text>
  <rect x="130" y="122" width="280" height="16" rx="8" style="fill:var(--accent,#0E8F75)" opacity="0.25"/>
  <text x="270" y="60" text-anchor="middle" font-size="14" style="fill:var(--accent,#0E8F75)">여기까진 해시나 reflog 로 되살린다</text>
  <text x="780" y="60" text-anchor="middle" font-size="14" opacity="0.8">"복구하기 힘들다"는 여기</text>
  <text x="450" y="222" text-anchor="middle" font-size="13" opacity="0.6">GitHub 서버는 PR 의 커밋을 refs/pull/N/head 이름표로 계속 붙들어서, PR 페이지에서는 그 뒤에도 보인다</text>
</svg></figure>
</section>
<hr>
<section>
  <p class="one">main 을 읽을 때 무엇이 달라지나.</p>
  <figure><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="main 의 git log 를 읽으면 merge commit 쪽은 머지 커밋과 브랜치 커밋이 섞여 나오고, squash 쪽은 PR 제목 한 줄씩만 나오며 세부는 각 커밋의 본문 안에 있다" font-family="'IBM Plex Mono', monospace" font-size="13">
  <text x="40" y="34" font-family="'IBM Plex Sans KR', sans-serif" font-size="18" font-weight="600">git log main 을 읽으면</text>
  <rect x="40" y="56" width="400" height="220" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="56" y="82" font-family="'IBM Plex Sans KR', sans-serif" font-size="14" opacity="0.7">merge commit 쪽</text>
  <text x="56" y="110">950fea9 Merge pull request #1</text>
  <text x="56" y="132" opacity="0.7">6203e83 fix(lab): handle empty input</text>
  <text x="56" y="154" opacity="0.7">f6371fc refactor(lab): rename helper</text>
  <text x="56" y="176" opacity="0.7">7821112 docs(lab): describe feature</text>
  <text x="56" y="198" opacity="0.7">9b1d208 feat(lab): add feature</text>
  <text x="56" y="220">3c3ba42 chore: seed</text>
  <text x="56" y="258" font-family="'IBM Plex Sans KR', sans-serif" font-size="13" opacity="0.7">PR 하나가 6줄. 20개면 100줄 넘게</text>

  <rect x="470" y="56" width="400" height="220" rx="6" fill="none" stroke-width="2" style="stroke:var(--accent,#0E8F75)"/>
  <text x="486" y="82" font-family="'IBM Plex Sans KR', sans-serif" font-size="14" opacity="0.7">squash 쪽</text>
  <text x="486" y="110" font-weight="600">0f0980d feat(lab): add feature (#1)</text>
  <text x="506" y="132" font-size="12" opacity="0.6">  * feat(lab): add feature</text>
  <text x="506" y="150" font-size="12" opacity="0.6">  * docs(lab): describe feature</text>
  <text x="506" y="168" font-size="12" opacity="0.6">  * refactor(lab): rename helper</text>
  <text x="506" y="186" font-size="12" opacity="0.6">  * fix(lab): handle empty input</text>
  <text x="486" y="220">3c3ba42 chore: seed</text>
  <text x="486" y="258" font-family="'IBM Plex Sans KR', sans-serif" font-size="13" opacity="0.7">PR 하나가 1줄. 세부는 그 줄의 본문 안에</text>
</svg></figure>
</section>
<section>
  <p class="one">그래서 squash 는 맞바꿈이다.</p>
  <figure><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-label="squash 로 얻는 것은 main 한 줄이 PR 하나라는 읽기 쉬움이고, 잃는 것은 PR 안의 커밋 단위로 bisect 와 blame 을 하는 정밀함이다. poteto 는 그 정밀함을 PR 을 작게 쪼개는 것으로 되찾는다" font-family="'IBM Plex Sans KR', 'Noto Sans KR', system-ui, sans-serif" font-size="16">
  <text x="230" y="40" text-anchor="middle" font-size="20" font-weight="600" style="fill:var(--accent,#0E8F75)">얻는 것</text>
  <text x="230" y="80" text-anchor="middle">main 한 줄 = PR 하나</text>
  <text x="230" y="108" text-anchor="middle" font-size="14" opacity="0.7">되돌리기도 PR 단위로 한 번</text>
  <text x="230" y="136" text-anchor="middle" font-size="14" opacity="0.7">wip, oops 가 main 에 안 남는다</text>

  <line x1="450" y1="20" x2="450" y2="160" stroke="currentColor" stroke-width="1" opacity="0.2"/>

  <text x="670" y="40" text-anchor="middle" font-size="20" font-weight="600" opacity="0.8">잃는 것</text>
  <text x="670" y="80" text-anchor="middle">PR 안의 커밋 단위 정밀함</text>
  <text x="670" y="108" text-anchor="middle" font-size="14" opacity="0.7">bisect 가 PR 하나를 통째로 가리킨다</text>
  <text x="670" y="136" text-anchor="middle" font-size="14" opacity="0.7">blame 이 4개 대신 1개를 가리킨다</text>

  <rect x="60" y="180" width="780" height="60" rx="8" fill="none" stroke-width="2" style="stroke:var(--accent,#0E8F75)"/>
  <text x="450" y="205" text-anchor="middle" font-size="15">poteto 의 답: 잃는 정밀함은 PR 을 작게 쪼개서 되찾는다</text>
  <text x="450" y="228" text-anchor="middle" font-size="13" opacity="0.7">"Prefer five narrow PRs to one large PR." 커밋 하나가 PR 하나가 될 크기면, squash 해도 main 의 한 줄이 충분히 작다</text>
</svg></figure>
</section>
</main>
